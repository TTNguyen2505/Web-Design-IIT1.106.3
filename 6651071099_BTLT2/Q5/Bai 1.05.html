<!DOCTYPE html>
<html lang="vi">

    <head>
        <meta charset="UTF-8">
        <title>Định dạng văn bản</title>
        <style>
            body {
                font-family: Arial, "Times New Roman", sans-serif;
                margin: 30px;

            h2 {
                color: #125833;
                font-family: Arial, "Times New Roman", sans-serif;

                margin: 8px 0;
                line-height: 1.6;
            }

            pre {
                font-family: "Courier New", Courier, monospace;

    <body>

        <h2 align="center">Định dạng văn bản</h2>

        <p><b><u>Hóa học:</u></b> <i>Nước:</i>
            <font color="#FF0000">H<sub>2</sub>O</font> ; <i>Axít Sunfuric:</i>
            <font color="#FF0000">H<sub>2</sub>SO<sub>4</sub></font>
        </p>

        <p><b><u>Toán học:</u></b> <i>Phương trình bậc 2:</i>
            <font color="#FF0000">ax<sup>2</sup> + bx + c = 0</font>
        </p>

        <p><b><u>Tin học:</u></b> <i>Vòng lặp For:</i></p>

        <pre style="background-color: #CCCCCC; color: #0000CC;">
            For i = 0 To 10

                Tong = Tong + 1

            Next</pre>
