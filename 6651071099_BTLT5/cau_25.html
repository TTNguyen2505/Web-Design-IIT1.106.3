<!DOCTYPE html>
<html lang="vi">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Câu 25 - Thực Đơn</title>
        <link rel="stylesheet" href="styles/cau_25.css">
    </head>

    <body>
        <div class="menu-container">
            <h2 class="menu-title">THỰC ĐƠN</h2>

            <!-- Bảng lựa chọn món ăn, nước uống và thời điểm -->
            <table class="selection-table">
                <thead>
                    <tr>
                        <th>Thức ăn</th>
                        <th>Nước uống</th>
                        <th>Thời điểm</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <select id="foodSelect" multiple size="7">
                                <option value="20000" selected>Bún bò</option>
                                <option value="18000">Hủ tiếu</option>
                                <option value="17000">Bánh canh</option>
                                <option value="19000">Phở bò</option>
                                <option value="15000" selected>Nuôi</option>
                                <option value="12000">Bánh mì thịt</option>
                                <option value="15000">Bánh cuốn</option>
                            </select>
                        </td>
                        <td>
                            <select id="drinkSelect" multiple size="7">
                                <option value="12000" selected>Cà phê đá</option>
                                <option value="15000">Cà phê sữa đá</option>
                                <option value="13000" selected>Chanh dây</option>
                                <option value="12000">Chanh muối</option>
                                <option value="14000">Xí muội</option>
                                <option value="13000">Sữa tươi</option>
                                <option value="17000">Cam vắt</option>
                            </select>
                        </td>
                        <td class="time-cell">
                            <div class="radio-option">
                                <input type="radio" id="daytime" name="timePeriod" value="day" checked>
                                <label for="daytime">Ban ngày</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="nighttime" name="timePeriod" value="night">
                                <label for="nighttime">Ban đêm</label>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Nút Tính tiền -->
            <div class="btn-wrap">
                <button type="button" class="btn-calc" onclick="tinhTien()">Tính tiền</button>
            </div>

            <!-- Bảng hiển thị hóa đơn các món đã dùng -->
            <table class="bill-table" id="billTable">
                <thead>
                    <tr>
                        <th class="bill-header">Các món đã dùng</th>
                        <th class="bill-header">Tiền</th>
                    </tr>
                </thead>
                <tbody id="billBody">
                    <tr>
                        <td>Bún bò</td>
                        <td>20000</td>
                    </tr>
                    <tr>
                        <td>Nuôi</td>
                        <td>15000</td>
                    </tr>
                    <tr>
                        <td>Cà phê đá</td>
                        <td>12000</td>
                    </tr>
                    <tr>
                        <td>Chanh dây</td>
                        <td>13000</td>
                    </tr>
                    <tr>
                        <td>Tổng tiền</td>
                        <td>60000 đồng</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script src="scripts/cau_25.js"></script>
    </body>

</html>
